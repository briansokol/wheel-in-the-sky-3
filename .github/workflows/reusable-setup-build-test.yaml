name: 'Reusable: Setup, Build, and Test'
on:
    workflow_call:
        inputs:
            build_command:
                description: 'The command to run for building the application'
                required: true
                type: string
        secrets:
            SENTRY_AUTH_TOKEN:
                required: true

jobs:
    setup:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Cache node_modules
              uses: actions/cache@v6
              id: node-modules-cache
              with:
                  path: node_modules
                  key: ${{ runner.os }}-pnpm-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

            - name: Install Dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: pnpm install --frozen-lockfile

    validate:
        needs: setup
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Cache node_modules
              uses: actions/cache@v6
              id: node-modules-cache
              with:
                  path: node_modules
                  key: ${{ runner.os }}-pnpm-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

            - name: Install Dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: pnpm install --frozen-lockfile

            - name: Check Types
              run: pnpm run check-types

            - name: Lint
              run: pnpm run lint

    build:
        needs: setup
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Cache node_modules
              uses: actions/cache@v6
              id: node-modules-cache
              with:
                  path: node_modules
                  key: ${{ runner.os }}-pnpm-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

            - name: Install Dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: pnpm install --frozen-lockfile

            - name: Build
              run: ${{ inputs.build_command }}
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

            # Cache the web dist directory for downstream jobs
            - name: Cache web dist directory
              id: cache-web-dist
              uses: actions/cache@v6
              with:
                  path: dist
                  key: ${{ runner.os }}-web-dist-${{ github.sha }}

    unit-tests:
        needs: [validate, build]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Cache node_modules
              uses: actions/cache@v6
              id: node-modules-cache
              with:
                  path: node_modules
                  key: ${{ runner.os }}-pnpm-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

            - name: Install Dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: pnpm install --frozen-lockfile

            # Restore the web dist directory cache from the build job
            - name: Restore web dist directory
              id: restore-web-dist
              uses: actions/cache@v6
              with:
                  path: dist
                  key: ${{ runner.os }}-web-dist-${{ github.sha }}
                  fail-on-cache-miss: true

            - name: Run Tests
              run: pnpm run test:ci
