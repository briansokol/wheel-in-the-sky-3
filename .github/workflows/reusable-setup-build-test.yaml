name: 'Reusable: Setup, Build, and Test'
on:
    workflow_call:
        inputs:
            build_command:
                description: 'The command to run for building the application'
                required: true
                type: string
        secrets:
            SENTRY_AUTH_TOKEN:
                required: true

jobs:
    setup:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Cache node_modules
              uses: actions/cache@v4
              id: node-modules-cache
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

            - name: Install Dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: npm ci

    validate:
        needs: setup
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Cache node_modules
              uses: actions/cache@v4
              id: node-modules-cache
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

            - name: Install Dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: npm ci

            - name: Check Dependency Consistency
              run: npm run sherif

            - name: Check Types
              run: npm run check-types

            - name: Lint
              run: npm run lint

    build:
        needs: setup
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Cache node_modules
              uses: actions/cache@v4
              id: node-modules-cache
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

            - name: Install Dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: npm ci

            - name: Build
              run: ${{ inputs.build_command }}
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

            # Cache the web dist directory for downstream jobs
            - name: Cache web dist directory
              id: cache-web-dist
              uses: actions/cache@v4
              with:
                  path: apps/web/dist
                  key: ${{ runner.os }}-web-dist-${{ github.sha }}

            - name: Cache shared build directory
              id: cache-shared-dist
              uses: actions/cache@v4
              with:
                  path: packages/shared/dist
                  key: ${{ runner.os }}-shared-dist-${{ github.sha }}

    unit-tests:
        needs: [validate, build]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Cache node_modules
              uses: actions/cache@v4
              id: node-modules-cache
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

            - name: Install Dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: npm ci

            # Restore the web dist directory cache from the build job
            - name: Restore web dist directory
              id: restore-web-dist
              uses: actions/cache@v4
              with:
                  path: apps/web/dist
                  key: ${{ runner.os }}-web-dist-${{ github.sha }}
                  fail-on-cache-miss: true

            # Restore the shared dist directory cache from the build job
            - name: Restore shared build directory
              id: restore-shared-dist
              uses: actions/cache@v4
              with:
                  path: packages/shared/dist
                  key: ${{ runner.os }}-shared-dist-${{ github.sha }}
                  fail-on-cache-miss: true

            - name: Run Tests
              run: npm run test:ci
